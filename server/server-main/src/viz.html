<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage Map</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --panel:#ffffffee; --border:#d2d2d7; --accent:#0a66c2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --fg:#f2f2f7; --muted:#a1a1a6; --panel:#2c2c2eee; --border:#3a3a3c; --accent:#4c9aff; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; box-shadow:0 2px 10px #0003; }
  #controls { top:10px; left:56px; right:10px; max-width:560px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #controls label { color:var(--muted); font-size:12px; }
  select, input, button { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--border);
    border-radius:6px; padding:4px 6px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #legend { bottom:22px; left:10px; max-width:calc(100% - 20px); }
  #legend .row { display:flex; align-items:center; gap:6px; margin:2px 0; white-space:nowrap; }
  #legend .sw { width:12px; height:12px; border-radius:50%; flex:none; border:1px solid #0004; }
  #legend .muted { color:var(--muted); font-size:12px; }
  #login { top:50%; left:50%; transform:translate(-50%,-50%); width:min(320px, calc(100% - 32px)); display:none; }
  #login h1 { font-size:16px; margin:0 0 8px; }
  #login input { width:100%; margin:4px 0; }
  #login .err { color:#d70015; min-height:1.2em; font-size:12px; }
  #status { color:var(--muted); font-size:12px; }
  .leaflet-popup-content { font-size:12px; line-height:1.5; }
  .leaflet-popup-content b { font-weight:600; }
</style>
</head>
<body>
<div id="map"></div>

<div id="controls" class="panel">
  <label>Day <select id="day"></select></label>
  <label>Colour <select id="colour">
    <option value="mode">Network mode</option>
    <option value="lte_band">LTE anchor band</option>
    <option value="nr_band">5G band</option>
    <option value="lte_rsrp">LTE RSRP</option>
    <option value="nr_rsrp">5G RSRP</option>
  </select></label>
  <button id="reload">Reload</button>
  <a href="/viz/charts" style="color:var(--accent)">Charts</a>
  <a href="/viz/findings" style="color:var(--accent)">Findings</a>
  <a href="/viz/dscp" style="color:var(--accent)">DSCP</a>
  <span id="status"></span>
</div>

<div id="legend" class="panel"></div>

<form id="login" class="panel">
  <h1>Operator login</h1>
  <input id="user" autocomplete="username" placeholder="Username" required>
  <input id="pass" type="password" autocomplete="current-password" placeholder="Password" required>
  <div class="err" id="loginErr"></div>
  <button class="primary" type="submit">Log in</button>
</form>

<script>
const MODE_COLOURS = {
  NR_SA: "#007a3d", NR_NSA: "#1fb954", NR_ADVANCED: "#00a3a3",
  LTE_CA: "#ff8c00", LTE_ADVANCED_PRO: "#d4a000", LTE: "#e0301e",
};
const BAND_COLOURS = {
  B1: "#e6194b", B3: "#3cb44b", B7: "#4363d8", B8: "#911eb4", B20: "#f58231",
  B28: "#42d4f4", B32: "#f032e6", B38: "#9a6324",
  n1: "#e6194b", n3: "#3cb44b", n28: "#42d4f4", n78: "#4363d8",
};
const NONE = "#9e9e9e";

const map = L.map("map", { zoomControl: true }).setView([55.71, 13.2], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);
const layer = L.layerGroup().addTo(map);

let points = [];
let fitted = false;
const $ = (id) => document.getElementById(id);

function token() { try { return sessionStorage.getItem("mp_jwt"); } catch { return null; } }
function setToken(t) { try { t ? sessionStorage.setItem("mp_jwt", t) : sessionStorage.removeItem("mp_jwt"); } catch {} }

function dayKey(ms) {
  const d = new Date(ms);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// RSRP → colour: red (≤ -120 dBm) through yellow to green (≥ -80 dBm).
function rsrpColour(v) {
  if (v == null) return NONE;
  const x = Math.max(0, Math.min(1, (v + 120) / 40));
  return `hsl(${Math.round(x * 120)}, 80%, 45%)`;
}

function colourOf(p, by) {
  switch (by) {
    case "mode": return MODE_COLOURS[p.mode] || NONE;
    case "lte_band": return BAND_COLOURS[p.lte_band] || NONE;
    case "nr_band": return p.nr_band && (p.mode == null || p.mode.startsWith("NR")) ? BAND_COLOURS[p.nr_band] || NONE : NONE;
    case "lte_rsrp": return rsrpColour(p.lte_rsrp);
    case "nr_rsrp": return rsrpColour(p.nr_rsrp);
  }
  return NONE;
}

function legendLabel(p, by) {
  switch (by) {
    case "mode": return p.mode || "not recorded (before network_type)";
    case "lte_band": return p.lte_band || "unknown";
    case "nr_band": return p.nr_band && (p.mode == null || p.mode.startsWith("NR")) ? p.nr_band : "no 5G cell";
  }
  return null;
}

function fmt(v, unit) { return v == null ? "–" : v + (unit || ""); }

function popup(p) {
  const t = new Date(p.t).toLocaleTimeString();
  return `<b>${t}</b> · ${p.plan || p.test_id}<br>
    Mode: <b>${p.mode || "not recorded"}</b><br>
    LTE: ${fmt(p.lte_band)} · EARFCN ${fmt(p.earfcn)} · PCI ${fmt(p.lte_pci)} · ${fmt(p.lte_rsrp, " dBm")}<br>
    5G: ${fmt(p.nr_band)} · PCI ${fmt(p.nr_pci)} · RSRP ${fmt(p.nr_rsrp, " dBm")} · RSRQ ${fmt(p.nr_rsrq, " dB")}<br>
    GPS ±${fmt(p.acc, " m")} · ${p.speed == null ? "–" : (p.speed * 3.6).toFixed(0) + " km/h"}`;
}

function render() {
  const day = $("day").value;
  const by = $("colour").value;
  const shown = points.filter((p) => !day || dayKey(p.t) === day);
  layer.clearLayers();
  const counts = new Map();
  for (const p of shown) {
    const c = colourOf(p, by);
    L.circleMarker([p.lat, p.lon], {
      radius: 5, color: "#0006", weight: 1, fillColor: c, fillOpacity: 0.85,
    }).bindPopup(() => popup(p)).addTo(layer);
    const label = legendLabel(p, by);
    if (label) {
      const e = counts.get(label) || { c, n: 0 };
      e.n++; counts.set(label, e);
    }
  }
  const lg = $("legend");
  if (by === "lte_rsrp" || by === "nr_rsrp") {
    lg.innerHTML = [-80, -90, -100, -110, -120].map((v) =>
      `<div class="row"><span class="sw" style="background:${rsrpColour(v)}"></span>${v} dBm</div>`).join("") +
      `<div class="row"><span class="sw" style="background:${NONE}"></span>no value</div>`;
  } else {
    const total = shown.length || 1;
    lg.innerHTML = [...counts.entries()].sort((a, b) => b[1].n - a[1].n).map(([k, e]) =>
      `<div class="row"><span class="sw" style="background:${e.c}"></span>${k}
       <span class="muted">${Math.round((100 * e.n) / total)} %</span></div>`).join("");
  }
  lg.innerHTML += `<div class="muted">${shown.length} samples · positions only while a test runs</div>`;
  if (shown.length && !fitted) {
    map.fitBounds(L.latLngBounds(shown.map((p) => [p.lat, p.lon])), { padding: [30, 30] });
    fitted = true;
  }
}

function fillDays() {
  const sel = $("day");
  const prev = sel.value;
  const days = [...new Set(points.map((p) => dayKey(p.t)))].sort().reverse();
  sel.innerHTML = `<option value="">All days</option>` + days.map((d) => `<option>${d}</option>`).join("");
  sel.value = days.includes(prev) ? prev : (days[0] || "");
}

async function load() {
  const t = token();
  if (!t) { showLogin(); return; }
  $("status").textContent = "Loading…";
  const r = await fetch("/api/v1/viz/track", { headers: { authorization: "Bearer " + t } });
  if (r.status === 401) { setToken(null); showLogin(); return; }
  if (r.status === 404) { $("status").textContent = "No track file yet"; return; }
  if (!r.ok) { $("status").textContent = "Error " + r.status; return; }
  const data = await r.json();
  points = data.points;
  fillDays();
  render();
  $("status").textContent = "Updated " + new Date(data.generated_utc_ms).toLocaleTimeString();
}

function showLogin() { $("login").style.display = "block"; $("user").focus(); }

$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  const r = await fetch("/api/v1/auth/login", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ username: $("user").value, password: $("pass").value }),
  });
  if (!r.ok) { $("loginErr").textContent = "Login failed"; return; }
  setToken((await r.json()).jwt);
  $("pass").value = "";
  $("login").style.display = "none";
  load();
});
$("day").addEventListener("change", () => { fitted = false; render(); });
$("colour").addEventListener("change", render);
$("reload").addEventListener("click", load);

load();
</script>
</body>
</html>
