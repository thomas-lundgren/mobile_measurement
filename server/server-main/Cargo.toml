[package]
name = "mp-server-main"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp_server_main"
path = "src/lib.rs"

[[bin]]
name = "mp-server-main"
path = "src/main.rs"

[dependencies]
mp-contracts = { path = "../contracts-rs" }
fieldtest-core = { path = "../../core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
axum = "0.8"
thiserror = "2"
jsonwebtoken = "9"
argon2 = "0.5"
ulid = "1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
p256 = { version = "0.13", features = ["ecdsa"] }
