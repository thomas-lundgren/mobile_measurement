[package]
name = "mp-test-control"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp_test_control"
path = "src/lib.rs"

[[bin]]
name = "mp-test-control"
path = "src/main.rs"

[dependencies]
mp-contracts = { path = "../contracts-rs" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
ulid = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
mp-data-generator = { path = "../data-generator" }
fieldtest-core = { path = "../../core" }
