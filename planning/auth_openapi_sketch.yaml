# Design sketch — not the source of truth.
#
# The authoritative OpenAPI is generated code-first from annotated Rust DTOs
# (`utoipa`) on `server-main`; see development_guide.md sec 10 and
# development_plan.md sec 7. This file exists to pin endpoint shapes during
# planning. Replace with generated `contracts/openapi/openapi.yaml` in Phase 1,
# then delete.
#
# Auth model: development_plan.md sec 7; spec sec 5.3.

openapi: 3.1.0
info:
  title: Measurement Platform — auth endpoints (design sketch)
  version: 0.0.0-draft

paths:

  /api/v1/auth/login:
    post:
      summary: Operator login (Controller)
      description: Username/password → short-lived JWT bearing a role claim.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/devices/enroll:
    post:
      summary: One-time device enrollment
      description: |
        Authenticated by a one-time enrollment token (operator-issued, out of
        band). Registers the device's SPKI public key and returns a
        server-assigned device_id / node_id. The enrollment token is burned on
        success.
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Enrollment token already consumed

  /api/v1/auth/challenge:
    post:
      summary: Issue a nonce for device challenge/response
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeRequest' }
      responses:
        '200':
          description: Challenge issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeResponse' }
        '404':
          description: Unknown device_id

  /api/v1/auth/verify:
    post:
      summary: Verify signed challenge, return session token
      description: |
        Server verifies the ECDSA-P256-SHA256 signature (ASN.1 DER) over the
        domain-separated blob:
          "mp-auth-v1" || server_id || challenge_id || nonce
        where || = the four UTF-8 strings joined by a 0x1F separator byte
        (exact bytes pinned in contracts/testvectors/auth_signing/).
        Verified against the device's registered SPKI pubkey. On success the
        challenge is deleted (single-use) and a short-lived opaque session
        token is returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResponse' }
        '401':
          description: Signature invalid, challenge expired, or already consumed

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Operator JWT or device session token, depending on audience.
    enrollmentToken:
      type: http
      scheme: bearer
      description: One-time operator-issued enrollment token.

  responses:
    Unauthorized:
      description: Missing or invalid credentials

  schemas:

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [jwt, expires_at_utc_ns, role]
      properties:
        jwt: { type: string }
        expires_at_utc_ns: { type: integer, format: int64 }
        role:
          type: string
          enum: [viewer, operator, admin]

    EnrollRequest:
      type: object
      required:
        [device_pubkey, pubkey_format, sig_alg, sig_format, platform,
         hw_info, protocol_version]
      properties:
        device_pubkey:
          type: string
          description: SPKI DER, base64.
        pubkey_format:
          type: string
          enum: [SPKI_DER]
        sig_alg:
          type: string
          enum: [ECDSA_P256_SHA256]
        sig_format:
          type: string
          enum: [ASN1_DER]
        platform:
          type: string
          enum: [android, ios]
        hw_info:
          type: object
          additionalProperties: true
          description: Model, OS version, etc. Free-form for now.
        protocol_version: { type: integer }

    EnrollResponse:
      type: object
      required:
        [device_id, node_id, server_time_utc_ns, schema_version,
         logging_config_version]
      properties:
        device_id: { type: string }
        node_id: { type: string }
        server_time_utc_ns: { type: integer, format: int64 }
        schema_version: { type: integer }
        logging_config_version: { type: integer }

    ChallengeRequest:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string }

    ChallengeResponse:
      type: object
      required:
        [challenge_id, nonce, server_id, expires_at_utc_ns,
         server_time_utc_ns, auth_domain]
      properties:
        challenge_id: { type: string }
        nonce:
          type: string
          description: base64, 32 random bytes.
        server_id:
          type: string
          description: Stable server identity, included in the signed blob.
        expires_at_utc_ns: { type: integer, format: int64 }
        server_time_utc_ns:
          type: integer
          format: int64
          description: Lets the UE sanity-check clock skew.
        auth_domain:
          type: string
          enum: [mp-auth-v1]
          description: Domain separator the client MUST prepend to the signed blob.

    VerifyRequest:
      type: object
      required: [challenge_id, signature]
      properties:
        challenge_id: { type: string }
        signature:
          type: string
          description: |
            base64 ECDSA-P256-SHA256 signature (ASN.1 DER) over
            "mp-auth-v1" || server_id || challenge_id || nonce.

    VerifyResponse:
      type: object
      required: [session_token, expires_at_utc_ns, logging_config_version]
      properties:
        session_token:
          type: string
          description: Opaque, short-lived. Use as Authorization Bearer.
        expires_at_utc_ns: { type: integer, format: int64 }
        logging_config_version:
          type: integer
          description: |
            Current server-side logging-config version; if higher than what
            the client holds, the client should expect a SET_LOGGING_CONFIG
            command.
