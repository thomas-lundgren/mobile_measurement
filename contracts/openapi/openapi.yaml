openapi: 3.1.0
info:
  title: Measurement Platform API
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /api/v1/auth/challenge:
    post:
      tags:
      - device-auth
      operationId: challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '404':
          description: ''
  /api/v1/auth/login:
    post:
      tags:
      - operator-auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: ''
  /api/v1/auth/verify:
    post:
      tags:
      - device-auth
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '401':
          description: ''
  /api/v1/devices:
    get:
      tags:
      - operator
      summary: 'Operator dashboard: every device with its latest reported status.'
      operationId: list_devices
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSummary'
        '401':
          description: ''
  /api/v1/devices/enroll:
    post:
      tags:
      - device-auth
      operationId: enroll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '400':
          description: ''
        '401':
          description: ''
  /api/v1/devices/register:
    post:
      tags:
      - device
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Capability'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggingConfig'
        '401':
          description: ''
  /api/v1/devices/{device_id}/command:
    get:
      tags:
      - device
      operationId: poll_command
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCommand'
        '204':
          description: ''
        '401':
          description: ''
  /api/v1/devices/{device_id}/command/{command_id}/ack:
    post:
      tags:
      - device
      operationId: ack_command
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      - name: command_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: ''
        '401':
          description: ''
        '404':
          description: ''
  /api/v1/devices/{device_id}/logging-config:
    post:
      tags:
      - operator
      summary: |-
        Operator pushes a logging-config update to a device: bump its version,
        enqueue `SET_LOGGING_CONFIG`, and report the new version (the device applies
        it and starts reporting it on its next heartbeat). Spec invariant 3.
      operationId: set_device_logging_config
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoggingConfig'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggingConfigAck'
        '401':
          description: ''
        '404':
          description: ''
  /api/v1/devices/{device_id}/reachability:
    post:
      tags:
      - device
      summary: |-
        The device's own reachability check (which ports/protocols toward the
        server get through the network it was on). Checks run on the device
        without the server — on a restrictive network it cannot be reached — and
        are uploaded later; each report is appended as one JSON line to
        `<upload_root>/reach/<device_id>.jsonl`.
      operationId: post_reachability
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReachabilityReport'
        required: true
      responses:
        '204':
          description: ''
        '401':
          description: ''
  /api/v1/devices/{device_id}/status:
    post:
      tags:
      - device
      operationId: post_status
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatus'
        required: true
      responses:
        '204':
          description: ''
        '401':
          description: ''
  /api/v1/tests:
    get:
      tags:
      - operator
      summary: Operator recent-tests list (newest first, capped).
      operationId: list_tests
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestSummary'
        '401':
          description: ''
    post:
      tags:
      - operator
      operationId: create_test
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestStatus'
        '401':
          description: ''
        '404':
          description: ''
        '409':
          description: ''
  /api/v1/tests/{test_id}:
    get:
      tags:
      - operator
      operationId: get_test
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestStatus'
        '401':
          description: ''
        '404':
          description: ''
  /api/v1/tests/{test_id}/stop:
    post:
      tags:
      - operator
      summary: |-
        Operator stop: drive the test terminal (CANCELLED) and stop its generators.
        Idempotent — stopping an already-terminal test just returns its status.
      operationId: stop_test
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestStatus'
        '401':
          description: ''
        '404':
          description: ''
  /api/v1/tests/{test_id}/summary:
    post:
      tags:
      - upload
      operationId: summary
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadManifest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadInitResponse'
        '401':
          description: ''
        '404':
          description: ''
        '503':
          description: Upload held (device not on the local network) and every base file is already stored; retry after a network change
  /api/v1/tests/{test_id}/upload/{upload_id}/complete:
    post:
      tags:
      - upload
      operationId: complete
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: string
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '401':
          description: ''
        '409':
          description: ''
  /api/v1/tests/{test_id}/upload/{upload_id}/files/{path}:
    put:
      tags:
      - upload
      operationId: put_file
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: string
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
        required: true
      responses:
        '204':
          description: ''
        '401':
          description: ''
        '422':
          description: ''
  /api/v1/time:
    get:
      tags:
      - device
      summary: |-
        Unauthenticated server-clock reading for device-side time sync. The UE pairs
        its own send/recv timestamps around this call (SNTP-over-HTTP) to estimate
        its offset from the server clock, which it records in `clock.parquet` so OWD
        can be offset-corrected (invariant 2; spec §11.3). `time_udp_port` advertises
        the lower-overhead UDP responder, which the UE prefers for a tighter bound.
      operationId: server_time
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTime'
components:
  schemas:
    AppAction:
      type: object
      description: One step of a scripted app_traffic timeline.
      required:
      - at_ms
      - kind
      - bytes
      properties:
        activity:
          type:
          - string
          - 'null'
          description: Activity name for the logs (contracts/enums/enums.yaml app_activities).
        at_ms:
          type: integer
          format: int64
          description: Start this long after the test starts; actions run in order.
          minimum: 0
        bytes:
          type: integer
          format: int64
          description: Size of each object.
          minimum: 0
        chunk_bytes:
          type:
          - integer
          - 'null'
          format: int32
          description: 'kind "down" with rate_kbps: bytes per paced write.'
          minimum: 0
        count:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of objects (default 1).
          minimum: 0
        delay_ms:
          type:
          - integer
          - 'null'
          format: int32
          description: 'kind "down": server think time before the first byte (ms).'
          minimum: 0
        kind:
          $ref: '#/components/schemas/AppActionKind'
        parallel:
          type:
          - integer
          - 'null'
          format: int32
          description: Objects in flight at once (default 1, at most 6).
          minimum: 0
        rate_kbps:
          type:
          - integer
          - 'null'
          format: int32
          description: 'kind "down": pace the response at this rate, like a token stream.'
          minimum: 0
        up_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'kind "down": bytes sent up first (request body, LLM context).'
          minimum: 0
    AppActionKind:
      type: string
      enum:
      - down
      - up
    AppEngine:
      type: string
      enum:
      - exchange
      - bulk
      - udp_burst
    AppLoop:
      type: string
      description: How an app_traffic flow's work arrives.
      enum:
      - closed
      - open
    AppProfile:
      type: string
      description: Built-in user models of an app_traffic flow.
      enum:
      - web
      - mail
      - video
      - social
      - mixed
      - agent
      - websearch
      - script
    AppToolPlacement:
      type: string
      description: Where an AI agent's tools run (app_traffic profiles "agent", "websearch").
      enum:
      - device
      - cloud
      - hybrid
    Battery:
      type: object
      required:
      - level_pct
      - charging
      properties:
        charging:
          type: boolean
        level_pct:
          type: integer
          format: int32
          minimum: 0
    Capability:
      type: object
      description: |-
        What a device CAN do. The server resolves the effective LoggingConfig as
        `intersection(plan_profile, capability)` + overrides.
      required:
      - radio
      - qos
      - mobility
      - timestamp_sources
      properties:
        mobility:
          $ref: '#/components/schemas/MobilityCapability'
        monitor:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MonitorCapability'
            description: Present only on MP Monitor enrollments; absent on MP Logger enrollments.
        qos:
          $ref: '#/components/schemas/QosCapability'
        radio:
          $ref: '#/components/schemas/RadioCapability'
        supports_ping:
          type: boolean
          description: Device can probe first-hop gateways and operator-pinned targets (Logger and Monitor).
        timestamp_sources:
          type: array
          items:
            $ref: '#/components/schemas/TimestampSource'
    CaptureConfig:
      type: object
      description: VPN-based passive traffic capture config (Monitor only).
      required:
      - enabled
      properties:
        apps:
          type: array
          items:
            type: string
          description: Package names to capture when scope = Allowlist.
        enabled:
          type: boolean
        quota_mb_per_day:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        scope:
          $ref: '#/components/schemas/VpnScope'
    ChallengeRequest:
      type: object
      required:
      - device_id
      properties:
        device_id:
          type: string
    ChallengeResponse:
      type: object
      required:
      - challenge_id
      - nonce
      - server_id
      - expires_at_utc_ns
      - server_time_utc_ns
      - auth_domain
      properties:
        auth_domain:
          type: string
        challenge_id:
          type: string
        expires_at_utc_ns:
          type: integer
          format: int64
        nonce:
          type: string
          description: base64, 32 random bytes.
        server_id:
          type: string
        server_time_utc_ns:
          type: integer
          format: int64
    Command:
      type: string
      enum:
      - RUN_TEST
      - STOP_TEST
      - SET_LOGGING_CONFIG
      - REQUEST_STATUS
      - REQUEST_UPLOAD
      - REBOOT_LOGGER
      - LIST_APPS
    CreateTestRequest:
      type: object
      description: |-
        Operator → server-main body of `POST /api/v1/tests`. `plan` is a port-less
        TestPlan; the server allocates ports.
      required:
      - device_id
      - plan
      properties:
        device_id:
          type: string
        logging_config_override:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LoggingConfig'
        plan:
          $ref: '#/components/schemas/TestPlan'
    DeviceCommand:
      type: object
      description: |-
        One queued command delivered to a device. `payload` shape depends on
        `command` (e.g. RunTestPayload for RUN_TEST); the device acks by
        `command_id`.
      required:
      - command_id
      - command
      properties:
        command:
          $ref: '#/components/schemas/Command'
        command_id:
          type: integer
          format: int64
        payload:
          type: object
    DeviceRole:
      type: string
      enum:
      - logger
      - monitor
    DeviceStatus:
      type: object
      description: Body of `POST /devices/{id}/status` — the periodic device heartbeat.
      required:
      - logger_state
      - logging_config_version
      - sampled_at
      properties:
        battery:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Battery'
        current_test_id:
          type:
          - string
          - 'null'
        link_state:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LinkState'
            description: 'Monitor only: current default-route gateway per interface.'
        logger_state:
          $ref: '#/components/schemas/LoggerState'
        logging_config_version:
          type: integer
          format: int32
          minimum: 0
        monitor_state:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MonitorState'
            description: 'Monitor only: live capture/ping engine snapshot.'
        pending_uploads:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        radio:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RadioSnapshot'
        sampled_at:
          $ref: '#/components/schemas/DualClock'
        storage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Storage'
    DeviceSummary:
      type: object
      description: |-
        Operator dashboard row: a device plus its latest reported status (status
        fields are null until the device first heartbeats). `GET /api/v1/devices`.
      required:
      - device_id
      - platform
      - status
      - logging_config_version
      - enrolled_at_utc_ns
      properties:
        battery_level_pct:
          type:
          - integer
          - 'null'
          format: int64
        current_test_id:
          type:
          - string
          - 'null'
        device_id:
          type: string
        device_label:
          type:
          - string
          - 'null'
        enrolled_at_utc_ns:
          type: integer
          format: int64
        hardware_id:
          type:
          - string
          - 'null'
          description: |-
            Stable per-handset ID shared by Logger and Monitor APKs on the same device.
            Controller groups rows by this field to form the handset view.
        last_seen_utc_ns:
          type:
          - integer
          - 'null'
          format: int64
        logger_state:
          type:
          - string
          - 'null'
        logging_config_version:
          type: integer
          format: int64
        model:
          type:
          - string
          - 'null'
        platform:
          type: string
        role:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DeviceRole'
            description: Enrolled app role. Absent on pre-Monitor rows — Controller treats as Logger.
        status:
          type: string
    Direction:
      type: string
      enum:
      - FromServer
      - ToServer
    DualClock:
      type: object
      required:
      - mono_ns
      - utc_ns
      properties:
        mono_ns:
          type: integer
          format: int64
        utc_ns:
          type: integer
          format: int64
    EnrollRequest:
      type: object
      description: Body of `POST /devices/enroll` (Bearer = one-time enrollment token).
      required:
      - device_pubkey
      - pubkey_format
      - sig_alg
      - sig_format
      - platform
      - protocol_version
      properties:
        device_pubkey:
          type: string
          description: SPKI DER, base64.
        hardware_id:
          type:
          - string
          - 'null'
          description: |-
            Stable per-handset identifier shared between Logger and Monitor APKs on the
            same device (Android SSAID when both apps share the same signing key).
            Used by the server to group co-located enrollments under one handset view.
        hw_info:
          $ref: '#/components/schemas/HwInfo'
        platform:
          $ref: '#/components/schemas/Platform'
        protocol_version:
          type: integer
          format: int32
          minimum: 0
        pubkey_format:
          type: string
        role:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DeviceRole'
            description: What this enrollment does. Absent = "logger" (backward-compatible default).
        sig_alg:
          type: string
        sig_format:
          type: string
    EnrollResponse:
      type: object
      required:
      - device_id
      - node_id
      - server_time_utc_ns
      - schema_version
      - logging_config_version
      properties:
        device_id:
          type: string
        logging_config_version:
          type: integer
          format: int32
          minimum: 0
        node_id:
          type: string
        schema_version:
          type: integer
          format: int32
          minimum: 0
        server_time_utc_ns:
          type: integer
          format: int64
    FileEncoding:
      type: string
      description: How a file's bytes are encoded in the upload.
      enum:
      - identity
      - zstd
    Flow:
      oneOf:
      - type: object
        required:
        - flow_id
        - rate_pps
        - type
        properties:
          flow_id:
            type: integer
            format: int32
            minimum: 0
          packet_size_bytes:
            type: integer
            format: int32
            minimum: 0
          rate_pps:
            type: integer
            format: int32
            minimum: 0
          type:
            type: string
            enum:
            - probe
      - type: object
        required:
        - flow_id
        - direction
        - rate_pps
        - packet_size_bytes
        - type
        properties:
          direction:
            $ref: '#/components/schemas/Direction'
          flow_id:
            type: integer
            format: int32
            minimum: 0
          packet_size_bytes:
            type: integer
            format: int32
            minimum: 0
          rate_pps:
            type: integer
            format: int32
            minimum: 0
          sndbuf_bytes:
            type:
            - integer
            - 'null'
            format: int32
            description: |-
              Sender only: limit SO_SNDBUF to this many bytes and send
              non-blocking (back-pressure test; full buffer → EAGAIN, logged).
            minimum: 0
          type:
            type: string
            enum:
            - realtime_udp
      - type: object
        required:
        - flow_id
        - direction
        - type
        properties:
          direction:
            $ref: '#/components/schemas/Direction'
          flow_id:
            type: integer
            format: int32
            minimum: 0
          rate_kbps:
            type:
            - integer
            - 'null'
            format: int32
            description: |-
              Sender only: pace writes to this rate (kbit/s, application bytes)
              instead of sending as fast as TCP allows. Omit for uncapped bulk.
            minimum: 0
          target_bytes:
            type:
            - integer
            - 'null'
            format: int32
            minimum: 0
          type:
            type: string
            enum:
            - bulk_tcp
      - type: object
        description: |-
          Logger-only: ICMP/UDP/TCP-SYN probes to auto-discovered first-hop gateways.
          No server endpoint — FlowBinding.server_port is None for this type.
        required:
        - flow_id
        - type
        properties:
          flow_id:
            type: integer
            format: int32
            minimum: 0
          ping_interval_ms:
            type: integer
            format: int32
            description: Probe cadence in ms. Default 1000.
            minimum: 0
          type:
            type: string
            enum:
            - gateway_ping
      - type: object
        description: |-
          DSCP transparency probe. UE cycles through dscp_values marking each outgoing
          packet; server echoes with observed + intended DSCP filled into the payload.
          See contracts/packets/dscp_probe.md.
        required:
        - flow_id
        - dscp_values
        - type
        properties:
          dscp_values:
            type: array
            items:
              type: integer
              format: int32
              minimum: 0
            description: DSCP values (0–63) to cycle through, one per packet (seq % len).
          flow_id:
            type: integer
            format: int32
            minimum: 0
          rate_pps:
            type: integer
            format: int32
            minimum: 0
          type:
            type: string
            enum:
            - dscp_probe
      - type: object
        description: |-
          App-like background load: simulated users on the UE request objects
          over TCP from the server (contracts/packets/app_request.md).
        required:
        - flow_id
        - profile
        - type
        properties:
          actions:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/AppAction'
            description: 'profile "script" only: the timeline to run.'
          dscp:
            type:
            - object
            - 'null'
            description: 'DSCP per activity (activity name -> 0–63); unlisted: unmarked.'
            additionalProperties:
              type: integer
              format: int32
              minimum: 0
            propertyNames:
              type: string
          engines:
            type:
            - object
            - 'null'
            description: |-
              How each activity's objects move (activity name -> engine);
              unlisted activities use exchange.
            additionalProperties:
              $ref: '#/components/schemas/AppEngine'
            propertyNames:
              type: string
          flow_id:
            type: integer
            format: int32
            minimum: 0
          loop:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AppLoop'
              description: 'profiles "agent", "websearch": closed (default) or open loop.'
          max_open_tasks:
            type:
            - integer
            - 'null'
            format: int32
            description: |-
              loop open: unfinished tasks per user before an arriving one is
              dropped (default 4).
            minimum: 0
          placement:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AppToolPlacement'
              description: 'profiles "agent", "websearch": where the tools run (default device).'
          profile:
            $ref: '#/components/schemas/AppProfile'
            description: 'User model: web | mail | video | social | mixed | script.'
          scale:
            type:
            - number
            - 'null'
            format: double
            description: Multiplies every object size (default 1.0); < 1 saves data.
          seed:
            type:
            - integer
            - 'null'
            format: int64
            description: 'Seed of the users'' choices (default 1): same seed, same requests.'
            minimum: 0
          task_interval_s:
            type:
            - number
            - 'null'
            format: double
            description: 'loop open: mean seconds between task arrivals per user (default 30).'
          type:
            type: string
            enum:
            - app_traffic
          workers:
            type:
            - integer
            - 'null'
            format: int32
            description: Concurrent users (1–16, default 1). A script runs on one.
            minimum: 0
      description: A flow, discriminated by `type`. Port-less — `Flow` carries no server_port.
    FlowBinding:
      type: object
      description: |-
        Server-allocated binding for one flow, keyed by flow_id. Lives in
        RunTestPayload / header, not in the plan. `server_port` is absent for
        gateway_ping flows (no server endpoint).
      required:
      - flow_id
      properties:
        flow_id:
          type: integer
          format: int32
          minimum: 0
        server_port:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    GateableEvent:
      type: string
      description: |-
        The config-gateable subset of event types (operational events are always
        logged regardless of config — see enums.yaml event_type_provenance).
      enum:
      - TEST_START
      - TEST_STOP
      - SIGNAL_LOSS_START
      - SIGNAL_LOSS_END
    HwInfo:
      type: object
      properties:
        device_label:
          type:
          - string
          - 'null'
        manufacturer:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        os_version:
          type:
          - string
          - 'null'
    InterfaceLinkState:
      type: object
      description: Per-interface default-route gateway state.
      required:
      - default_gw
      properties:
        default_gw:
          type: string
        since_mono_ns:
          type:
          - integer
          - 'null'
          format: int64
    LinkState:
      type: object
      description: Current link state per physical interface. Absent on Logger heartbeats.
      properties:
        rmnet:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InterfaceLinkState'
        wlan:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InterfaceLinkState'
    LoggerState:
      type: string
      enum:
      - INITIALIZING
      - REGISTERING
      - IDLE
      - WAITING_FOR_TEST
      - PREPARING
      - RUNNING_TEST
      - COOLDOWN
      - UPLOAD_PENDING
      - UPLOADING
      - ERROR
    LoggingConfig:
      type: object
      description: What a device WILL log. Server enforces `effective ⊆ capability`.
      required:
      - version
      - radio
      - qos
      - mobility
      - events
      - gps
      - clock_calibration_interval_sec
      properties:
        capture:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CaptureConfig'
            description: 'Monitor only: VPN-based passive capture. Absent/null = disabled.'
        clock_calibration_interval_sec:
          type: integer
          format: int32
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/GateableEvent'
          description: Gateable measurement events to log live (subset of EventType).
        gps:
          type: boolean
        mobility:
          $ref: '#/components/schemas/MobilityLogging'
        ping:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PingConfig'
            description: 'Monitor only: background latency probing. Absent/null = disabled.'
        qos:
          $ref: '#/components/schemas/QosLogging'
        radio:
          $ref: '#/components/schemas/RadioLogging'
        version:
          type: integer
          format: int32
          description: Monotonic config version; drives SET_LOGGING_CONFIG drift detection.
          minimum: 0
    LoggingConfigAck:
      type: object
      description: |-
        Result of pushing a logging-config update to a device
        (`POST /api/v1/devices/{id}/logging-config`): the new effective version that
        the device will report once it applies the `SET_LOGGING_CONFIG` command.
      required:
      - device_id
      - logging_config_version
      properties:
        device_id:
          type: string
        logging_config_version:
          type: integer
          format: int64
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
    LoginResponse:
      type: object
      required:
      - jwt
      - expires_at_utc_ns
      - role
      properties:
        expires_at_utc_ns:
          type: integer
          format: int64
        jwt:
          type: string
        role:
          $ref: '#/components/schemas/OperatorRole'
    ManifestFile:
      type: object
      required:
      - path
      - size_bytes
      - sha256
      - encoding
      properties:
        encoding:
          $ref: '#/components/schemas/FileEncoding'
        path:
          type: string
        sha256:
          type: string
          description: Lowercase hex SHA-256 of the stored (post-encoding) bytes.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
    MobilityCapability:
      type: object
      properties:
        beam_switch:
          type: boolean
        explicit_ho_events:
          type: boolean
        rrc_state:
          type: boolean
    MobilityLogging:
      type: object
      properties:
        beam_switch:
          type: boolean
        explicit_ho_events:
          type: boolean
        rrc_state:
          type: boolean
    MonitorCapability:
      type: object
      properties:
        can_list_apps:
          type: boolean
        supports_vpn_capture:
          type: boolean
    MonitorState:
      type: object
      description: Live snapshot of the Monitor's capture and ping engines. Absent on Logger heartbeats.
      required:
      - active
      properties:
        active:
          type: boolean
        apps_inventory_version:
          type:
          - integer
          - 'null'
          format: int64
          description: Current installed-app inventory version; server requests LIST_APPS when stale.
          minimum: 0
        buckets_pending:
          type: integer
          format: int32
          minimum: 0
        bytes_observed:
          type: integer
          format: int64
          minimum: 0
        bytes_today:
          type: integer
          format: int64
          minimum: 0
        pings_lost:
          type: integer
          format: int32
          minimum: 0
        pings_sent:
          type: integer
          format: int32
          minimum: 0
        quota_remaining_mb:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        scope:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VpnScope'
        top_peers:
          type: array
          items:
            $ref: '#/components/schemas/TopPeer'
    NetworkContext:
      type: object
      required:
      - transport
      properties:
        operator:
          type:
          - string
          - 'null'
        transport:
          $ref: '#/components/schemas/NetworkTransport'
        validated:
          type:
          - boolean
          - 'null'
        wifi_freq_mhz:
          type:
          - integer
          - 'null'
          format: int64
        wifi_ssid:
          type:
          - string
          - 'null'
    NetworkTransport:
      type: string
      enum:
      - CELLULAR
      - WIFI
      - ETHERNET
      - OTHER
      - NONE
    OperatorRole:
      type: string
      enum:
      - viewer
      - operator
      - admin
    PingConfig:
      type: object
      description: Background latency-probing config (Monitor only).
      required:
      - enabled
      properties:
        auto_target_count:
          type: integer
          format: int32
          minimum: 0
        default_interval_ms:
          type: integer
          format: int32
          description: Default probe cadence in ms.
          minimum: 0
        enabled:
          type: boolean
        follow_apps:
          type: array
          items:
            type: string
          description: Package names whose observed peers feed the auto ping-target pool.
        targets:
          type: array
          items:
            $ref: '#/components/schemas/PingTarget'
          description: Operator-pinned targets. First-hop and auto-derived targets are added device-side.
    PingTarget:
      type: object
      description: A single operator-pinned latency target.
      required:
      - label
      - host
      properties:
        host:
          type: string
          description: IPv4, IPv6, or hostname. Resolved once on config apply.
        interval_ms:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        label:
          type: string
    Platform:
      type: string
      enum:
      - android
      - ios
    QosCapability:
      type: object
      properties:
        5qi:
          type: boolean
          description: 5G QoS Identifier availability.
        qfi:
          type: boolean
        slice_info:
          type: boolean
    QosLogging:
      type: object
      properties:
        5qi:
          type: boolean
        qfi:
          type: boolean
        slice_info:
          type: boolean
    RadioCapability:
      type: object
      required:
      - serving_cell
      properties:
        bler:
          type: boolean
        bwp:
          type: boolean
        cqi:
          type: boolean
        drx:
          type: boolean
        harq:
          type: boolean
        lte_fallback:
          type: boolean
        mcs:
          type: boolean
        mimo_layers:
          type: boolean
        neighbor_cells:
          type: boolean
        serving_cell:
          type: array
          items:
            $ref: '#/components/schemas/ServingCellField'
        tx_power:
          type: boolean
    RadioLogging:
      type: object
      required:
      - serving_cell
      properties:
        bler:
          type: boolean
        bwp:
          type: boolean
        cqi:
          type: boolean
        drx:
          type: boolean
        harq:
          type: boolean
        lte_fallback:
          type: boolean
        mcs:
          type: boolean
        mimo_layers:
          type: boolean
        neighbor_cells:
          type: boolean
        serving_cell:
          type: array
          items:
            $ref: '#/components/schemas/ServingCellField'
        tx_power:
          type: boolean
    RadioSnapshot:
      type: object
      description: Coarse serving-cell snapshot for the dashboard — NOT a measurement record.
      properties:
        nci:
          type:
          - integer
          - 'null'
          format: int64
        pci:
          type:
          - integer
          - 'null'
          format: int64
        rsrp:
          type:
          - integer
          - 'null'
          format: int32
        rsrq:
          type:
          - integer
          - 'null'
          format: int32
        sinr:
          type:
          - integer
          - 'null'
          format: int32
    ReachCheck:
      type: object
      required:
      - protocol
      - port
      - kind
      - ok
      properties:
        error:
          type:
          - string
          - 'null'
        kind:
          $ref: '#/components/schemas/ReachKind'
        ok:
          type: boolean
        port:
          type: integer
          format: int32
          minimum: 0
        protocol:
          $ref: '#/components/schemas/ReachProtocol'
        rtt_ms:
          type:
          - number
          - 'null'
          format: double
        seen_as:
          type:
          - string
          - 'null'
    ReachKind:
      type: string
      enum:
      - reach
      - http
    ReachProtocol:
      type: string
      enum:
      - tcp
      - udp
    ReachTrigger:
      type: string
      enum:
      - NETWORK_CHANGE
      - SERVICE_START
      - MANUAL
    ReachabilityReport:
      type: object
      description: Body of `POST /devices/{id}/reachability`.
      required:
      - checked_at
      - trigger
      - network
      - checks
      properties:
        checked_at:
          $ref: '#/components/schemas/DualClock'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReachCheck'
        network:
          $ref: '#/components/schemas/NetworkContext'
        trigger:
          $ref: '#/components/schemas/ReachTrigger'
    RunTestPayload:
      type: object
      description: Payload of the RUN_TEST command delivered to a device.
      required:
      - test_id
      - session_id
      - server_host
      - test_plan
      - flow_bindings
      properties:
        flow_bindings:
          type: array
          items:
            $ref: '#/components/schemas/FlowBinding'
        logging_config_override:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LoggingConfig'
        server_host:
          type: string
        session_id:
          type: string
          description: |-
            Server-assigned logging session this test belongs to; the device stamps
            it as the session_id join column.
        test_id:
          type: string
        test_plan:
          $ref: '#/components/schemas/TestPlan'
    ServerTime:
      type: object
      description: |-
        Response of `GET /api/v1/time`: the server's clock, for the UE's
        HTTP clock-sync fallback (SNTP-over-HTTP; spec §11.3).
      required:
      - server_utc_ns
      - time_udp_port
      properties:
        server_utc_ns:
          type: integer
          format: int64
          description: Server UTC when the request was handled.
        time_udp_port:
          type: integer
          format: int32
          description: UDP time responder the UE should prefer (contracts/packets/time_sync.md).
          minimum: 0
    ServingCellField:
      type: string
      description: Per-sample serving-cell fields a device can report.
      enum:
      - pci
      - nci
      - tac
      - nrarfcn
      - rsrp
      - rsrq
      - sinr
    Storage:
      type: object
      required:
      - free_bytes
      properties:
        free_bytes:
          type: integer
          format: int64
        total_bytes:
          type:
          - integer
          - 'null'
          format: int64
    TestControlState:
      type: string
      enum:
      - IDLE
      - PREPARE
      - WAITING_FOR_GENERATOR
      - WAITING_FOR_CLIENT
      - RUNNING
      - STOPPING
      - DONE
      - FAILED
    TestPlan:
      type: object
      description: |-
        The port-less recipe for one test. Server-allocated ports travel separately
        as `FlowBinding`s (see RunTestPayload / header).
      required:
      - name
      - version
      - duration_sec
      - flows
      properties:
        duration_sec:
          type: integer
          format: int32
          minimum: 0
        flows:
          type: array
          items:
            $ref: '#/components/schemas/Flow'
        name:
          type: string
        version:
          type: integer
          format: int32
          minimum: 0
    TestResult:
      type: string
      enum:
      - COMPLETED
      - PARTIAL
      - FAILED
      - CANCELLED
    TestStatus:
      type: object
      description: Controller-facing test status.
      required:
      - test_id
      - device_id
      - plan_name
      - state
      - created_utc_ns
      properties:
        created_utc_ns:
          type: integer
          format: int64
        device_id:
          type: string
        ended_utc_ns:
          type:
          - integer
          - 'null'
          format: int64
        plan_name:
          type: string
        result:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TestResult'
        started_utc_ns:
          type:
          - integer
          - 'null'
          format: int64
        state:
          $ref: '#/components/schemas/TestControlState'
        test_id:
          type: string
    TestSummary:
      type: object
      description: Compact test row for the operator's recent-tests list. `GET /api/v1/tests`.
      required:
      - test_id
      - device_id
      - plan_name
      - state
      - created_utc_ns
      properties:
        created_utc_ns:
          type: integer
          format: int64
        device_id:
          type: string
        ended_utc_ns:
          type:
          - integer
          - 'null'
          format: int64
        plan_name:
          type: string
        result:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TestResult'
        state:
          $ref: '#/components/schemas/TestControlState'
        test_id:
          type: string
    TimestampSource:
      type: string
      description: Available clock sources.
      enum:
      - mono
      - utc
      - gps
    TopPeer:
      type: object
      description: Compact busy-peer row for the Controller's live view.
      required:
      - peer_ip
      - bytes_60s
      properties:
        app_label:
          type:
          - string
          - 'null'
        bytes_60s:
          type: integer
          format: int64
          description: Bytes (up+dn) observed in the last 60-second window.
          minimum: 0
        peer_ip:
          type: string
    UploadInitResponse:
      type: object
      description: 'Response to phase 1: the resume mechanism (file-granular).'
      required:
      - upload_id
      - needed_paths
      properties:
        needed_paths:
          type: array
          items:
            type: string
        upload_id:
          type: string
    UploadManifest:
      type: object
      description: Body of `POST /tests/{id}/summary` (upload phase 1).
      required:
      - test_result
      - node
      - files
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/ManifestFile'
        node:
          $ref: '#/components/schemas/UploadNode'
        result_reason:
          type:
          - string
          - 'null'
        test_result:
          $ref: '#/components/schemas/TestResult'
    UploadNode:
      type: string
      description: 'The uploading node: only the mobile uploads (the server writes in place).'
      enum:
      - mobile
    VerifyRequest:
      type: object
      required:
      - challenge_id
      - signature
      properties:
        challenge_id:
          type: string
        signature:
          type: string
          description: base64 ASN.1-DER signature over the mp-auth-v1 blob.
    VerifyResponse:
      type: object
      required:
      - session_token
      - expires_at_utc_ns
      - logging_config_version
      properties:
        expires_at_utc_ns:
          type: integer
          format: int64
        logging_config_version:
          type: integer
          format: int32
          minimum: 0
        session_token:
          type: string
    VpnScope:
      type: string
      enum:
      - all
      - allowlist
