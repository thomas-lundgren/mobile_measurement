# Single source of truth for enum string names that appear on the wire and
# in logs. Codegen target: Rust enums, Java enums, Python Literals/Enums.
# Every component imports from this file — never hand-write these strings.
#
# Wire-format rules:
#   - Command names, state names, event types  → SCREAMING_SNAKE_CASE
#   - Role, platform, flow_type, test_result   → snake_case / lowercase
#   - Direction                                 → PascalCase (per spec sec 8.3)
#
# Round-trip test (development_plan.md sec 2): every codegen target must
# serialize→deserialize each enum string and match the value here byte-for-
# byte.

# ---------------------------------------------------------------------------
# Control-plane commands (server → device, via /devices/{id}/command).
# Payload schemas live alongside the OpenAPI generated from `utoipa`.
# ---------------------------------------------------------------------------
commands:
  - RUN_TEST            # start a test; payload includes test_id, test_plan, flows[]
  - STOP_TEST           # cancel current test
  - SET_LOGGING_CONFIG  # push new effective logging profile (carries logging_config_version)
  - REQUEST_STATUS      # force an immediate device status report
  - REQUEST_UPLOAD      # trigger upload of pending sessions
  - REBOOT_LOGGER       # restart the foreground service (recovery)
  - LIST_APPS           # monitor only: request current installed-app inventory

# ---------------------------------------------------------------------------
# Test-control: per-device state machine (spec sec 6.2).
# ---------------------------------------------------------------------------
test_control_states:
  - IDLE
  - PREPARE
  - WAITING_FOR_GENERATOR
  - WAITING_FOR_CLIENT
  - RUNNING
  - STOPPING
  - DONE
  - FAILED

# ---------------------------------------------------------------------------
# Data-generator state machine (spec sec 7.3).
# ---------------------------------------------------------------------------
generator_states:
  - INITIALIZING
  - READY
  - WAITING_FOR_CLIENT
  - RUNNING
  - STOPPING
  - STOPPED
  - FAILED

# ---------------------------------------------------------------------------
# Logger app state machine (spec sec 8.5).
# ---------------------------------------------------------------------------
logger_states:
  - INITIALIZING
  - REGISTERING        # post-enrollment session: challenge → verify → register
  - IDLE
  - WAITING_FOR_TEST
  - PREPARING
  - RUNNING_TEST
  - COOLDOWN
  - UPLOAD_PENDING
  - UPLOADING
  - ERROR

# ---------------------------------------------------------------------------
# Flow types — what kind of traffic the generators produce (spec sec 10).
# ---------------------------------------------------------------------------
flow_types:
  - probe          # UDP echo, RTT (loopback; either side may host)
  - realtime_udp   # fixed-rate UDP, one-way delay + jitter
  - bulk_tcp       # bulk throughput, separate UL/DL connections for Bidirectional
  - gateway_ping   # Logger only: ICMP/UDP/TCP-SYN latency probe to first-hop gateways during a test
  - dscp_probe     # DSCP transparency: UE cycles through dscp_values; server echoes with observed + intended DSCP filled in
  - app_traffic    # app-like background load: UE agents (web, mail, video, social, mixed, script) request objects over TCP

# ---------------------------------------------------------------------------
# Flow direction — who sends payload. PascalCase on the wire (spec sec 8.3).
# Loopback flows (probe) ignore direction.
#
# Bidirectional is intentionally absent: per remediation 2.2 (Bulk TCP) and
# 2.3 (Realtime UDP), bidirectional traffic is modeled as two unidirectional
# flows with distinct flow_id. This keeps the wire contract simple and
# removes ACK-cross-traffic / asymmetric-keepalive ambiguity.
# ---------------------------------------------------------------------------
directions:
  - FromServer    # server sends, mobile receives
  - ToServer      # mobile sends, server receives

# ---------------------------------------------------------------------------
# Node role within a flow.
# ---------------------------------------------------------------------------
roles:
  - mobile
  - server

# ---------------------------------------------------------------------------
# Operator role claim in JWT (auth model: development_plan.md sec 7).
# ---------------------------------------------------------------------------
operator_roles:
  - viewer
  - operator    # MVP default
  - admin

# ---------------------------------------------------------------------------
# Device platform — recorded at enrollment.
# ---------------------------------------------------------------------------
platforms:
  - android
  - ios         # contract-only for now; iOS implementation out of MVP scope

# ---------------------------------------------------------------------------
# Event types written to events.parquet (spec sec 12.7). Some are logged
# live by the logger; others are derived in post-processing from
# radio.parquet (PCI/NCI/NRARFCN changes).
# ---------------------------------------------------------------------------
event_types:
  # logged live — measurement events (gateable via logging_config.events)
  - TEST_START
  - TEST_STOP
  - SIGNAL_LOSS_START   # no serving cell for > N seconds
  - SIGNAL_LOSS_END
  # logged live — operational events (ALWAYS logged, not config-gated)
  - CLIENT_CONNECTED    # server, per flow: event_metadata {peer_ip, peer_port, protocol}
  - SERVER_DISCONNECTED
  - UPLOAD_STARTED
  - ERROR
  # monitor-only operational events (always logged when monitor is active)
  - FIRST_HOP_CHANGE        # default-route gateway changed on rmnet or wlan
  - MONITOR_CONFIG_APPLIED  # a SET_LOGGING_CONFIG was applied; new version recorded
  - VPN_SCOPE_CHANGE        # VPN allowlist/mode changed
  - QUOTA_REACHED           # daily byte quota exhausted; capture paused
  # derived in post-processing from radio.parquet
  - HANDOVER              # PCI or NCI change between consecutive samples
  - NEIGHBOR_COUNT_CHANGE # significant change in neighbor cell list
  - COVERAGE_GAP          # RSRP dropped below threshold
  - BAND_CHANGE           # NRARFCN changed

event_type_provenance:
  # logged_live splits into measurement events (subset that
  # logging_config.events can enable/disable) and operational events
  # (always written regardless of config).
  logged_live_gateable:
    - TEST_START
    - TEST_STOP
    - SIGNAL_LOSS_START
    - SIGNAL_LOSS_END
  logged_live_always:
    - CLIENT_CONNECTED
    - SERVER_DISCONNECTED
    - UPLOAD_STARTED
    - ERROR
  logged_live_monitor_always:
    - FIRST_HOP_CHANGE
    - MONITOR_CONFIG_APPLIED
    - VPN_SCOPE_CHANGE
    - QUOTA_REACHED
  derived_post_processing:
    - HANDOVER
    - NEIGHBOR_COUNT_CHANGE
    - COVERAGE_GAP
    - BAND_CHANGE

# ---------------------------------------------------------------------------
# Test result terminal states (remediation M4b). Reported on the
# upload manifest (test_result) and the test-summary endpoint.
# ---------------------------------------------------------------------------
test_results:
  - COMPLETED     # ran to scheduled end
  - PARTIAL       # ran some duration, ended early (network loss, OS kill)
  - FAILED        # could not start or aborted with no useful data
  - CANCELLED     # operator stop

# ---------------------------------------------------------------------------
# Device roles — what an enrolled app does. One enrollment per (device, role).
# A physical handset may have both a logger and a monitor enrollment.
# ---------------------------------------------------------------------------
device_roles:
  - logger    # MP Logger: controlled traffic tests
  - monitor   # MP Monitor: VPN-based passive capture + background pings

# ---------------------------------------------------------------------------
# VPN capture scope — how widely Monitor's VPN tunnel is applied.
# ---------------------------------------------------------------------------
vpn_scopes:
  - all        # all apps except Monitor itself and Logger (hard-excluded)
  - allowlist  # only the explicitly listed package names

# ---------------------------------------------------------------------------
# Ping probe kind — which transport was used for the latency measurement.
# The scheduler tries ICMP first, then falls back down the list.
# ---------------------------------------------------------------------------
probe_kinds:
  - icmp         # ICMP echo (InetAddress.isReachable)
  - udp          # UDP echo to traceroute-style port
  - tcp_syn      # TCP SYN to port 80/443
  - unreachable  # all probe types failed within budget; target marked inactive

# ---------------------------------------------------------------------------
# Clock reference — clock.parquet `source`: what the node's offset was
# measured against.
# ---------------------------------------------------------------------------
clock_sources:
  - server_udp   # UDP time exchange with server-main (contracts/packets/time_sync.md)
  - server_http  # GET /api/v1/time fallback (looser bound: RTT/2)
  - gps          # GNSS time
  - ntp          # an NTP server
  - chrony       # the host's chrony estimate (server node)
  - system       # the OS clock, unverified

# ---------------------------------------------------------------------------
# Log value sets written by the core (both nodes).
# ---------------------------------------------------------------------------
log_nodes:            # `node` column of every table; also the per-node folder name
  - mobile
  - server
packet_directions:    # packets.parquet direction
  - SENT
  - RECEIVED
packet_protocols:     # packets.parquet protocol
  - UDP
  - TCP
send_statuses:        # packets.parquet send_status (SENT rows)
  - OK                # handed to the kernel
  - EAGAIN            # socket send buffer full: back pressure, dropped locally
  - ENOBUFS           # dropped by the qdisc / driver queue
  - ERROR             # any other error; not sent

# ---------------------------------------------------------------------------
# radio.parquet value sets (written by the Logger, read by the analysis).
# ---------------------------------------------------------------------------
# network_type: the radio mode the phone reports (TelephonyDisplayInfo
# override type, else the network type). Any other TelephonyManager network
# type is written as OTHER_<n>.
radio_network_types:
  - LTE
  - LTE_CA             # carrier aggregation
  - LTE_ADVANCED_PRO
  - NR_NSA             # 5G anchored on LTE
  - NR_ADVANCED        # 5G NSA with mmWave / high capacity
  - NR_SA              # 5G standalone

# cell_connection_status of the serving cell row (null when unknown).
cell_connection_statuses:
  - PRIMARY
  - SECONDARY

# wifi_standard of the Wi-Fi link (ScanResult.WIFI_STANDARD_*).
wifi_standards:
  - 802.11a/b/g
  - 802.11n
  - 802.11ac
  - 802.11ax
  - 802.11ad
  - 802.11be

# ---------------------------------------------------------------------------
# App-traffic activity — what an app_traffic object is for. Carried as a u8
# in the request (contracts/packets/app_request.md): the code is the position
# in this list, so entries are only ever appended. Logged by name in
# packets.parquet app_activity on both nodes.
# ---------------------------------------------------------------------------
app_activities:
  - other            # 0
  - web_page         # 1  HTML of a page view
  - web_object       # 2  the page's objects
  - mail_sync        # 3
  - mail_attachment  # 4
  - mail_send        # 5
  - video_chunk      # 6
  - feed_image       # 7
  - photo_upload     # 8
  - llm_call         # 9  context up, streamed reply
  - mcp_call         # 10 tool call on the phone (MCP)
  - web_fetch        # 11 page fetched by an agent's tool
  - cloud_tool       # 12 tool result in a cloud-tool reply (see app_request.md)
  - llm_resume       # 13 the reply's next turn after a cloud tool
