table: packets
scope: per-node, all flows
spec: "§12.3"
description: >
  One row per packet event observed by this node: a SENT or RECEIVED packet
  for any flow in the test. Probe RTT is reconstructed by matching a node's
  SENT row to its RECEIVED echo row on (flow_id, sequence_number). Realtime
  OWD is reconstructed at the receiver from sender_* vs mono_ns/utc_ns.

join_columns:
  - { name: device_id,  type: utf8, nullable: false, doc: "Owning device (dictionary-encoded constant)." }
  - { name: session_id, type: utf8, nullable: false }
  - { name: test_id,    type: utf8, nullable: false }
  - { name: node,       type: utf8, nullable: false, doc: "mobile | server." }

columns:
  - { name: flow_id,         type: uint32, nullable: false }
  - { name: sequence_number, type: uint64, nullable: false }
  - { name: direction,       type: utf8,   nullable: false, doc: "SENT | RECEIVED (remediation 4.3). Without it bidirectional data is uninterpretable." }
  - { name: mono_ns,         type: uint64, nullable: false, doc: "Local monotonic time of this send/receive event." }
  - { name: utc_ns,          type: uint64, nullable: false, doc: "Local UTC time of this event." }
  - { name: payload_size,    type: uint32, nullable: false, doc: "On-wire UDP payload / TCP chunk size in bytes." }
  - { name: protocol,        type: utf8,   nullable: false, doc: "UDP | TCP." }
  - { name: local_port,      type: uint32, nullable: true }
  - { name: remote_port,     type: uint32, nullable: true }

  # Embedded sender timestamps — present on RECEIVED realtime packets (the
  # sender writes them into the packet body). Null for probe and for SENT rows.
  - { name: sender_mono_ns,  type: uint64, nullable: true, doc: "Sender's mono at transmit, from the packet body. OWD input." }
  - { name: sender_utc_ns,   type: uint64, nullable: true, doc: "Sender's UTC at transmit, from the packet body. OWD input." }

  # Interval analysis (realtime flows).
  - { name: expected_interval_ns, type: uint64, nullable: true, doc: "Nominal flow spacing = 1e9 / rate_pps." }
  - { name: actual_interval_ns,   type: uint64, nullable: true, doc: "recv_mono_ns[i] - recv_mono_ns[i-1] over CONSECUTIVE RECEIVED packets of this flow, gaps preserved (remediation 4.2). Null for the first received packet and for SENT rows." }

  # DSCP transparency (dscp_probe flow only — null for all other flow types).
  # See contracts/packets/dscp_probe.md for the measurement protocol.
  - { name: dscp_sent, type: uint8, nullable: true, doc: "DSCP value (0–63) this node intended to set on the outgoing IP packet. Present for dscp_probe SENT rows; null otherwise." }
  - { name: dscp_recv, type: uint8, nullable: true, doc: "DSCP value (0–63) actually observed in the received packet's IP header (via IP_RECVTOS / IPV6_RECVTCLASS). Present for dscp_probe RECEIVED rows; null otherwise." }

  # Delivery timing / back pressure (realtime_udp only — null otherwise).
  # See spec "Realtime UDP Flow" (delivery timing and back pressure) and core/src/udp_timing.rs.
  - { name: kernel_rx_utc_ns, type: uint64, nullable: true, doc: "RECEIVED: kernel receive time (SO_TIMESTAMPNS, UTC ns) — when the driver handed the packet up. utc_ns minus this = host wake-up latency." }
  - { name: send_status,      type: utf8,   nullable: true, doc: "SENT: OK | EAGAIN (socket send buffer full: back pressure) | ENOBUFS (qdisc/driver drop) | ERROR. One row per attempt; non-OK attempts never left the host." }
  - { name: send_call_ns,     type: uint32, nullable: true, doc: "SENT: duration of the send syscall (long when a blocking send waited for buffer space)." }
  - { name: sock_outq_bytes,  type: uint32, nullable: true, doc: "SENT: bytes queued below the socket after the send (SIOCOUTQ), not yet released by the qdisc/driver. Null if the ioctl is refused." }

  # App-like background load (app_traffic only — null otherwise). Every row of
  # one object shares its object_id as sequence_number: the request (24 B), then
  # the data, then for uploads the server's 24-B acknowledgement.
  # See contracts/packets/app_request.md.
  - { name: app_activity,     type: utf8,   nullable: true, doc: "What the object is for: web_page, web_object, mail_sync, mail_attachment, mail_send, video_chunk, feed_image, photo_upload or other." }
  - { name: app_object_bytes, type: uint64, nullable: true, doc: "Total size of the object this row belongs to." }
