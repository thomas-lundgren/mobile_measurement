plugins {
    id 'com.android.application'
}

android {
    namespace 'com.measurement.logger'
    compileSdk 35

    defaultConfig {
        applicationId "com.measurement.logger"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // JVM unit tests (src/test): the Logger's wire bodies against contracts/.
    testOptions {
        unitTests.all {
            systemProperty 'contracts.dir', file('../../contracts').absolutePath
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    // the real org.json (android.jar's is a stub on the JVM)
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.networknt:json-schema-validator:1.5.6'
}

// The shared Rust core (libfieldtest_core.so) is built by ../build_apk.sh via
// cargo-ndk into src/main/jniLibs/<abi>/.
