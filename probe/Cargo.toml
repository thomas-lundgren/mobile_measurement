[package]
name = "mp-probe"
version = "0.2.0"
edition = "2021"
description = "Shell-privileged on-phone collector: modem-link qdisc stats, UDP counters and radio-log events, served to the Logger over localhost."

[[bin]]
name = "mp-probe"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = { workspace = true }

[dev-dependencies]
serde_yaml = { workspace = true }
