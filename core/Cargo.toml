[package]
name = "fieldtest-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Workspace deps
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# JNI
jni = "0.21"

# Arrow / Parquet
arrow = "54"
parquet = "54"
arrow-schema = "54"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
