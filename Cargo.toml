[workspace]
members = ["core", "server", "spikes/stage-a-harness"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
