[workspace]
members = [
    "core",
    "server/contracts-rs",
    "server/server-main",
    "server/data-generator",
    "server/test-control",
    "spikes/stage-a-harness",
    "probe",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = "0.4"
utoipa = "5"

# Dev-only: parity tests that read contracts/*.yaml
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = true
